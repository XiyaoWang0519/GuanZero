name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          python -m pip install -r requirements-dev.txt
      - name: Install CPU training dependencies
        run: |
          python -m pip install 'torch>=2.9,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-train.txt
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: C++ unit tests
        run: ./build/cpp/tests/gd_tests
      - name: Oracle
        run: python oracle/test_gd_reference.py
      - name: Python suites
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: python -m pytest -q tests -n 2 --dist=worksteal
      - name: Training smoke and resume
        run: PY=python ./scripts/preflight.sh cpu .work/ci-preflight
      - name: Fuzzer
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGD_BUILD_FUZZ=ON
          cmake --build build -j
          ./build/cpp/fuzz/gd_fuzz --rounds 20000 --threads 2 --deep-every 1
          ./build/cpp/fuzz/gd_fuzz --rounds 20000 --threads 2 --deep-every 1 --full
      - name: Sanitizers
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGD_SANITIZE=ON -DGD_BUILD_PYTHON=OFF -DGD_BUILD_FUZZ=ON
          cmake --build build-asan -j
          ./build-asan/cpp/tests/gd_tests
          ./build-asan/cpp/fuzz/gd_fuzz --rounds 2000 --threads 2 --deep-every 8
