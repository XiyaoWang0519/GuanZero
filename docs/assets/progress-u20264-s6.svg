<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" width="880" height="444" role="img" aria-labelledby="t d">
<title id="t">GuanZero against the strongest published Guandan agent</title><desc id="d">Net levels per round against the strongest published Guandan agent on 4,000 duplicate deals, rising from -2.05 at 172M self-play decisions to -1.56 at 989M and -1.36 at 1.33B; with test-time search -1.71 at 172M and -1.33 at 989M on 200-300 paired deals. 0 would be parity.</desc>
