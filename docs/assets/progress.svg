.bg{fill:#fbf8f3}.ink{fill:#1d1a16}.ink2{fill:#5b5650}.mute{fill:#8a847b}
.grid{stroke:#e7e1d7;stroke-width:1}.axis{stroke:#bdb5a8;stroke-width:1}
.ln{stroke:#c0392b;stroke-width:2.25;fill:none;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:#c0392b;stroke:#fbf8f3;stroke-width:2}.ci{stroke:#c0392b;stroke-opacity:.45;stroke-width:1.5}
.hol{fill:#fbf8f3;stroke:#c0392b;stroke-width:2.25}.ref{stroke:#8a847b;stroke-width:1.25;stroke-dasharray:4 5}
.lead{stroke:#bdb5a8;stroke-width:1}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
</style>
