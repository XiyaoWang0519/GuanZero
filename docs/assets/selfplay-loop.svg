<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-labelledby="t">
<title id="t">The self-play loop: rules engine, self-play against current and past versions, PPO update, snapshot pool, and back; test-time search at play time</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<style>
.bg{fill:#fbf8f3}.ink{fill:#1d1a16}.ink2{fill:#5b5650}.mute{fill:#8a847b}.red{fill:#c0392b}
.node{fill:#fffdf9;stroke:#2a2520;stroke-width:1.4}.arc{fill:none;stroke:#c0392b;stroke-width:2}
.ring{fill:none;stroke:#e7e1d7;stroke-width:1;stroke-dasharray:3 5}.side{fill:#fffdf9;stroke:#2f5f9e;stroke-width:1.4;stroke-dasharray:5 4}
.blue{fill:#2f5f9e}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.cjk{font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif}
</style>
<rect class="bg" width="880" height="390" rx="14"/>
<ellipse class="ring" cx="400" cy="200" rx="250" ry="128"/>
<text class="ink serif" x="400" y="204" font-size="34" font-style="italic" text-anchor="middle" fill-opacity=".85">self-play</text>
<text class="mute" x="400" y="228" font-size="12" text-anchor="middle">from random weights, no human games</text>
<path class="arc" d="M539.8,93.9 A250,128 0 0 1 631.8,152.1" marker-end="url(#a)"/>
<path class="arc" d="M631.8,247.9 A250,128 0 0 1 539.8,306.1" marker-end="url(#a)"/>
<path class="arc" d="M260.2,306.1 A250,128 0 0 1 168.2,247.9" marker-end="url(#a)"/>
<path class="arc" d="M168.2,152.1 A250,128 0 0 1 260.2,93.9" marker-end="url(#a)"/>
<rect class="node" x="287.0" y="45.0" width="226" height="54" rx="10"/>
<text class="ink" x="400.0" y="68.0" font-size="14" font-weight="600" text-anchor="middle">Self-play</text>
<text class="ink2" x="400.0" y="86.0" font-size="11.5" text-anchor="middle">four seats on the C++20 rules engine</text>
<rect class="node" x="537.0" y="173.0" width="226" height="54" rx="10"/>
<text class="ink" x="650.0" y="196.0" font-size="14" font-weight="600" text-anchor="middle">Game records</text>
<text class="ink2" x="650.0" y="214.0" font-size="11.5" text-anchor="middle">every move, reward and hidden hand</text>
<rect class="node" x="287.0" y="301.0" width="226" height="54" rx="10"/>
<text class="ink" x="400.0" y="324.0" font-size="14" font-weight="600" text-anchor="middle">PPO update</text>
<text class="ink2" x="400.0" y="342.0" font-size="11.5" text-anchor="middle">policy + auxiliary heads</text>
<rect class="node" x="37.0" y="173.0" width="226" height="54" rx="10"/>
<text class="ink" x="150.0" y="196.0" font-size="14" font-weight="600" text-anchor="middle">Snapshot pool</text>
<text class="ink2" x="150.0" y="214.0" font-size="11.5" text-anchor="middle">past versions become opponents</text>
<path d="M513.0,72.0 C573.0,72.0 630.0,46.0 668.0,46.0" fill="none" stroke="#2f5f9e" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect class="side" x="670" y="19.0" width="180" height="54" rx="10"/>
<text class="blue" x="760" y="42" font-size="14" font-weight="600" text-anchor="middle">Test-time search</text>
<text class="ink2" x="760" y="60" font-size="11.5" text-anchor="middle">the same policy, at play time</text>
</svg>