<title id="t">GuanZero against the strongest published Guandan agent</title><desc id="d">Net levels per round against the strongest published Guandan agent on 4,000 duplicate deals, rising from −2.05 at 172M self-play decisions to −1.56 at 989M, −1.36 at 1.33B, −1.15 at 1.83B, −0.87 at 2.33B, −0.66 at 2.84B, −0.55 at 3.33B, −0.50 at 3.84B, −0.42 at 4.33B and −0.33 at 4.84B; with test-time search −1.71 at 172M, −1.33 at 989M and −0.51 at 2.84B and −0.22 at 4.84B on 200-800 paired deals. 0 would be parity.</desc>
